<header class="topbar d-flex justify-content-between align-items-center p-2 shadow-sm bg-white">
  <div class="topbar-left">
    <span class="fw-bold">Tableau de bord</span>
  </div>
  <div class="topbar-right d-flex align-items-center gap-3">
    <span class="user-name">{{ request.user.get_full_name }}</span>
    <a href="{% url 'dashboard:profile' %}" class="btn btn-sm btn-outline-primary">
      <i class="bi bi-person-circle"></i> Mon Profil
    </a>
    <a href="{% url 'accounts_users_web:logout' %}" class="btn btn-sm btn-outline-danger">
      <i class="bi bi-box-arrow-right"></i> Déconnexion
    </a>
  </div>
</header>





{% comment %} <header class="topbar d-flex justify-content-between align-items-center px-3 py-2 shadow-sm bg-white">
  <div class="topbar-left d-flex align-items-center">
    <span class="fw-bold text-primary fs-5">
      Bienvenue, {{ request.user.first_name|default:request.user.username }}
    </span>
    {% comment %}Affichage complet optionnel : {{ request.user.get_full_name }}

    </a>

      <i class="bi bi-box-arrow-right"></i> Déconnexion
    </a>
  </div>
</header> {% endcomment %}
