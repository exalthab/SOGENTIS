<div class="card mb-4 shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h6 class="mb-0 fw-bold">Paramètres rapides</h6>
    <i class="bi bi-gear text-secondary"></i>
  </div>
  <div class="card-body">

    <!-- Mode sombre -->
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="darkModeSwitch">
      <label class="form-check-label" for="darkModeSwitch">
        Activer le mode sombre
      </label>
    </div>

    <!-- Notifications -->
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="notificationsSwitch" checked>
      <label class="form-check-label" for="notificationsSwitch">
        Notifications
      </label>
    </div>

    <!-- Auto-mise à jour -->
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="autoUpdateSwitch">
      <label class="form-check-label" for="autoUpdateSwitch">
        Mise à jour automatique
      </label>
    </div>

    <hr>

    <div class="d-grid">
      <button class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-repeat me-1"></i> Réinitialiser
      </button>
    </div>
  </div>
</div>
