{% load i18n %}
<div class="card border-0 shadow-sm">
  <div class="card-body py-5 text-center">
    <div class="display-6 mb-2">{{ icon|default:"📭" }}</div>
    <h2 class="h5 fw-bold">{{ title|default:_("Aucun élément") }}</h2>
    <p class="text-muted mb-3">{{ text|default:_("Il n’y a rien à afficher pour le moment.") }}</p>
    {% if action_url and action_label %}
      <a class="btn btn-primary" href="{{ action_url }}">{{ action_label }}</a>
    {% endif %}
  </div>
</div>
