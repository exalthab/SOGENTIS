{% extends "dashboard/base_dashboard.html" %}
{% load static i18n %}

{% block content %}
<div class="container-fluid">

    <h1 class="h4 mb-3">{{ title }}</h1>

    <form method="post" enctype="multipart/form-data" class="card shadow-sm p-4">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="mt-3">
            <button class="btn btn-success">
                <i class="fas fa-save"></i> {% trans "Enregistrer" %}
            </button>
            <a href="{% url 'dashboard:vendor:products' %}" class="btn btn-link">
                {% trans "Annuler" %}
            </a>
        </div>
    </form>

</div>
{% endblock %}
