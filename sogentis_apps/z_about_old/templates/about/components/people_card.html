<div class="people-card">
    <img src="{{ item.photo|file_or_static:'/static/about/img/default_person.jpg' }}" 
         alt="{{ item.name }}" loading="lazy">
    <h5>{{ item.name }}</h5>
    {% if type == "team" %}
        <p>{{ item.role }}</p>
    {% elif type == "child" %}
        <p>{% trans "Financé:" %} {{ item.funded_pct }}%</p>
    {% endif %}
</div>
