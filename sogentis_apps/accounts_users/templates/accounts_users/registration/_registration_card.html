{# templates/accounts_users/registration/_registration_card.html #}

<div class="registration-card card text-center shadow-sm h-100" style="width: 18rem;">
    <a href="{{ url }}" class="text-decoration-none text-reset d-block h-100">
        <div class="card-body d-flex flex-column justify-content-center align-items-center">

            <!-- Icone -->
            <div class="fs-1 mb-3">{{ icon }}</div>

            <!-- Titre -->
            <h5 class="card-title">{{ title }}</h5>

            <!-- Description -->
            <p class="card-text text-muted text-center">{{ description }}</p>

            <!-- Bouton -->
            <div class="mt-auto w-100">
                <button class="btn btn-primary w-100">
                    {% trans "Créer un compte" %}
                </button>
            </div>

        </div>
    </a>
</div>






{% comment %} {#accounts_users/registration/_registration_card.html#}

</a> {% endcomment %}
