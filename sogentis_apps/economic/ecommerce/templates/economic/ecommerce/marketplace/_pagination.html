{% load i18n %}
{% if is_paginated %}
  <nav class="mt-4" aria-label="{% trans 'Pagination' %}">
    <ul class="pagination justify-content-center">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.category %}&category={{ request.GET.category }}{% endif %}{% if sort %}&sort={{ sort }}{% endif %}{% if badge %}&badge={{ badge }}{% endif %}{% if request.GET.price_max %}&price_max={{ request.GET.price_max }}{% endif %}">&laquo;</a>
        </li>
      {% endif %}

      <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>

      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.category %}&category={{ request.GET.category }}{% endif %}{% if sort %}&sort={{ sort }}{% endif %}{% if badge %}&badge={{ badge }}{% endif %}{% if request.GET.price_max %}&price_max={{ request.GET.price_max }}{% endif %}">&raquo;</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
