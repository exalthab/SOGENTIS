{% extends "economic/b2b/base_b2b.html" %}
{% load i18n %}
{% block b2b_content %}
<h1 class="h5 mb-2">{% trans "Soumettre une offre" %}</h1>
<div class="text-muted mb-3">{{ rfq.title }} — {{ rfq.company }}</div>
<form method="post" class="card">
  {% csrf_token %}
  <div class="card-body">
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">{% trans "Envoyer" %}</button>
  </div>
</form>
{% endblock %}
