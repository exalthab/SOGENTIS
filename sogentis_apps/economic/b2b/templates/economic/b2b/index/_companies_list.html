{# templates/economic/b2b/index/_companies_list.html #}
{% load i18n dashboard_tags %}

<div class="list-group">

  {% for c in companies %}
    {% safe_url "economic:b2b:company_detail" c.id as company_detail_url %}

    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
       href="{{ company_detail_url|default:'#' }}"
       {% if not company_detail_url %}aria-disabled="true" tabindex="-1"{% endif %}>
      <span class="fw-semibold">{{ c.name }}</span>
      <span class="badge bg-light text-dark">{{ c.status }}</span>
    </a>
  {% endfor %}

</div>
