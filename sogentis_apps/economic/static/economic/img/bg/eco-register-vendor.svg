  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.42"/>

  <circle cx="1180" cy="210" r="370" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="420" cy="740" r="460" fill="url(#glowB)" filter="url(#blur)"/>

  <path d="M-40 280C190 130 500 120 720 280C950 445 1180 450 1460 325C1540 285 1610 255 1660 244V0H-40V280Z"
