<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B16"/>
      <stop offset="0.48" stop-color="#0A1F3D"/>
      <stop offset="1" stop-color="#083B35"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1220 210) rotate(135) scale(560 560)">
      <stop stop-color="#19B394" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#19B394" stop-opacity="0"/>
