  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.45"/>

  <circle cx="1220" cy="210" r="360" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="420" cy="730" r="440" fill="url(#glowB)" filter="url(#blur)"/>

  <path d="M-40 270C180 120 480 120 700 270C930 430 1170 440 1450 315C1540 270 1610 242 1660 232V0H-40V270Z"
