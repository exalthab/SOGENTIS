{# templates/economic/formations/partials/_hero.html #}
{% load i18n %}

<div class="formations-hero p-4 p-md-5 rounded-4 border bg-light">
  <div class="row align-items-center g-3">
    <div class="col-12 col-lg-8">
      <div class="badge text-bg-dark mb-2">{% trans "Formations" %}</div>
      <h1 class="h3 fw-black mb-2">{{ title }}</h1>
      <p class="text-muted mb-0">{{ subtitle }}</p>
    </div>
    <div class="col-12 col-lg-4 text-lg-end">
      <a class="btn btn-primary" href="{% url 'economic:formations:courses:list' %}">
        {% trans "Voir les formations" %}
      </a>
      {% if user.is_authenticated %}
        <a class="btn btn-outline-secondary ms-2" href="{% url 'economic:formations:learner:dashboard' %}">
          {% trans "Mon espace" %}
        </a>
      {% endif %}
    </div>
  </div>
</div>
