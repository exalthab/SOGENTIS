{# templates/economic/formations/partials/_category_pills.html #}

<div class="d-flex flex-wrap gap-2">
  {% for cat in categories %}

       href="{% url 'economic:formations:courses:list' %}?category={{ cat.slug }}">
      {{ cat }}

  {% endfor %}
</div>
