{# templates/economic/formations/partials/_formations_navbar.html #}
{% load static i18n %}

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom formations-nav">
  <div class="container">

    <a class="navbar-brand fw-bold" href="{% url 'economic:formations:index' %}">
      🎓 {% trans "Formations" %}
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#formationsNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="formationsNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
             href="{% url 'economic:formations:index' %}">
            {% trans "Accueil" %}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'course_list' %}active{% endif %}"
             href="{% url 'economic:formations:course_list' %}">
            {% trans "Catalogue des formations" %}
          </a>
        </li>

      </ul>

      <form class="d-flex" method="get" action="{% url 'economic:formations:course_list' %}">
        <input class="form-control form-control-sm me-2"
               type="search"
               name="q"
               placeholder="{% trans 'Rechercher une formation' %}">
        <button class="btn btn-sm btn-outline-primary" type="submit">
          {% trans "Rechercher" %}
        </button>
      </form>
    </div>

  </div>
</nav>
