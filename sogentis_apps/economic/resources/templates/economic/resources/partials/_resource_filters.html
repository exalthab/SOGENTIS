{% load i18n %}

<form method="get" class="row g-3 mb-4">

  <div class="col-md-4">
    <input type="text"
           name="q"
           value="{{ request.GET.q }}"
           class="form-control"
           placeholder="{% trans 'Rechercher une ressource…' %}">
  </div>

  <div class="col-md-4">
    <select name="category" class="form-select">
      <option value="">{% trans "Toutes les catégories" %}</option>
      {% for cat in categories %}
        <option value="{{ cat.slug }}"
          {% if request.GET.category == cat.slug %}selected{% endif %}>
          {{ cat.name }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-4">
    <button class="btn btn-outline-secondary w-100">
      🔍 {% trans "Filtrer" %}
    </button>
  </div>

</form>
